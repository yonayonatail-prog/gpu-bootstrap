name: Verify bootstrap
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq aria2
      - run: bash -n bootstrap.sh scripts/install_comfy.sh scripts/install_llm.sh
      - run: python -m unittest discover -s tests -v
      - run: python orchestrator.py video --plan
      - run: python scripts/make_workflows.py && git diff --exit-code -- comfy/workflows
