name: netayume-lumina
services:
  comfyui: true
  llm: false
# The base checkpoint is downloaded by this profile; only the user's LoRA is local.
# Put the LoRA in ComfyUI/models/loras.
models: [netayume_lumina_v3]
custom_nodes: []
workflows: [netayume_lumina_lora.json]
download:
  max_concurrent: 3
  retries: 3
disk:
  install_budget_gib: 20
  reserve_gib: 5
comfyui:
  repo: https://github.com/Comfy-Org/ComfyUI.git
  revision: 7ea14e59da26b822bffc7df7220c07d9319392d5
  port: 8188
  startup_timeout_seconds: 300
